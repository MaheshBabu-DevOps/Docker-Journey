<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Docker Architecture — animated</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1100" height="560" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="550" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#24292f">DOCKER ARCHITECTURE</text>

  <!-- ============ CLIENT ============ -->
  <rect x="20" y="60" width="280" height="400" rx="26" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="160" y="95" text-anchor="middle" font-size="20" font-weight="700" fill="#24292f">Client</text>

  <!-- CLI terminal -->
  <text x="40" y="125" font-size="13" font-weight="600" fill="#57606a">CLI</text>
  <rect x="45" y="135" width="230" height="110" rx="10" fill="#0d1117"/>
  <text x="58" y="165" font-size="14" fill="#7ee787" font-family="monospace">$ docker run nginx</text>
  <rect x="58" y="180" width="9" height="16" fill="#e6edf3">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- GUI -->
  <text x="40" y="285" font-size="13" font-weight="600" fill="#57606a">GUI</text>
  <rect x="45" y="295" width="230" height="140" rx="10" fill="#1f2937"/>
  <rect x="45" y="295" width="230" height="22" rx="10" fill="#374151"/>
  <circle cx="60" cy="306" r="4" fill="#ff5f56"/><circle cx="74" cy="306" r="4" fill="#ffbd2e"/><circle cx="88" cy="306" r="4" fill="#27c93f"/>
  <text x="160" y="345" text-anchor="middle" font-size="14" fill="#e5e7eb">Docker Desktop</text>
  <rect x="65" y="365" width="190" height="14" rx="4" fill="#4b5563"/>
  <rect x="65" y="388" width="190" height="14" rx="4" fill="#4b5563"/>
  <rect x="65" y="411" width="190" height="14" rx="4" fill="#4b5563"/>

  <!-- ============ SERVER ============ -->
  <rect x="400" y="60" width="300" height="400" rx="26" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="550" y="95" text-anchor="middle" font-size="20" font-weight="700" fill="#24292f">Server (Docker Host)</text>

  <!-- daemon -->
  <rect x="430" y="110" width="240" height="70" rx="8" fill="#e6e6e6" stroke="#8c959f" stroke-width="2">
    <animate attributeName="fill"
             values="#e6e6e6;#e6e6e6;#a5d0ff;#a5d0ff;#e6e6e6;#e6e6e6"
             keyTimes="0;0.18;0.20;0.70;0.72;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="550" y="140" text-anchor="middle" font-size="18" font-weight="600" fill="#24292f">Docker Daemon</text>
  <text x="550" y="163" text-anchor="middle" font-size="13" fill="#57606a" font-family="monospace">dockerd</text>

  <!-- manages arrow -->
  <line x1="550" y1="182" x2="550" y2="250" stroke="#8b949e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="565" y="222" font-size="13" fill="#57606a">manages</text>

  <!-- images + containers area -->
  <rect x="418" y="258" width="264" height="190" rx="14" fill="none" stroke="#8b949e" stroke-dasharray="6 5"/>

  <rect x="432" y="270" width="112" height="26" rx="4" fill="#f5a94a"/>
  <text x="488" y="288" text-anchor="middle" font-size="14" fill="#24292f">Images</text>
  <rect x="556" y="270" width="112" height="26" rx="4" fill="#f5a94a"/>
  <text x="612" y="288" text-anchor="middle" font-size="14" fill="#24292f">Containers</text>
  <rect x="432" y="296" width="112" height="140" rx="4" fill="#fff8ee" stroke="#f5a94a" stroke-width="2"/>
  <rect x="556" y="296" width="112" height="140" rx="4" fill="#fff8ee" stroke="#f5a94a" stroke-width="2"/>

  <!-- image layers stack (appears after pull) -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.38;0.40;0.97;0.98;1" dur="12s" repeatCount="indefinite"/>
    <rect x="452" y="330" width="72" height="18" rx="3" fill="#0969da"/>
    <rect x="452" y="354" width="72" height="18" rx="3" fill="#2f81f7"/>
    <rect x="452" y="378" width="72" height="18" rx="3" fill="#79c0ff"/>
    <text x="488" y="420" text-anchor="middle" font-size="13" fill="#57606a">nginx image</text>
  </g>

  <!-- container (appears after create) -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.54;0.97;0.98;1" dur="12s" repeatCount="indefinite"/>
    <polygon points="612,326 646,344 646,382 612,400 578,382 578,344" fill="#4b6584" stroke="#2f3e50" stroke-width="2"/>
    <polyline points="578,344 612,362 646,344" fill="none" stroke="#2f3e50" stroke-width="2"/>
    <line x1="612" y1="362" x2="612" y2="400" stroke="#2f3e50" stroke-width="2"/>
    <circle cx="612" cy="362" r="6" fill="#3fb950">
      <animate attributeName="r" values="5;8;5" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="612" y="422" text-anchor="middle" font-size="13" fill="#57606a">nginx running</text>
  </g>

  <!-- ============ REGISTRY ============ -->
  <rect x="800" y="60" width="280" height="400" rx="26" fill="#f5a94a" stroke="#d98a1f" stroke-width="2"/>
  <text x="940" y="95" text-anchor="middle" font-size="20" font-weight="700" fill="#24292f">Registry</text>
  <text x="940" y="135" text-anchor="middle" font-size="34" font-weight="700" fill="#1d63ed">docker</text>
  <text x="940" y="165" text-anchor="middle" font-size="20" fill="#3d3d3d">Hub</text>
  <!-- image tiles -->
  <g fill="#fff8ee" stroke="#24292f" stroke-width="2">
    <rect x="830" y="185" width="46" height="46" rx="5"/><rect x="886" y="185" width="46" height="46" rx="5"/>
    <rect x="942" y="185" width="46" height="46" rx="5"/><rect x="998" y="185" width="46" height="46" rx="5"/>
    <rect x="830" y="241" width="46" height="46" rx="5"/><rect x="886" y="241" width="46" height="46" rx="5"/>
    <rect x="942" y="241" width="46" height="46" rx="5"/><rect x="998" y="241" width="46" height="46" rx="5"/>
    <rect x="830" y="297" width="46" height="46" rx="5"/><rect x="886" y="297" width="46" height="46" rx="5"/>
    <rect x="942" y="297" width="46" height="46" rx="5"/><rect x="998" y="297" width="46" height="46" rx="5"/>
  </g>
  <!-- highlighted nginx tile -->
  <rect x="830" y="185" width="46" height="46" rx="5" fill="#2f81f7" stroke="#24292f" stroke-width="2">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.20;0.50;0.51;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="853" y="213" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.20;0.50;0.51;1" dur="12s" repeatCount="indefinite"/>
    nginx
  </text>
  <text x="940" y="400" text-anchor="middle" font-size="16" fill="#3d3d3d">or other registries</text>
  <text x="940" y="424" text-anchor="middle" font-size="13" fill="#3d3d3d">ECR · Harbor · GHCR</text>

  <!-- ============ STATIC FLOW LINES ============ -->
  <!-- client -> daemon -->
  <path d="M 275 190 L 350 190 L 350 135 L 428 135" fill="none" stroke="#8b949e" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="312" y="120" text-anchor="middle" font-size="12" fill="#57606a">Docker actions</text>
  <!-- daemon -> client (result) -->
  <path d="M 430 158 L 375 158 L 375 215 L 277 215" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="3 5" marker-end="url(#arrow)"/>
  <!-- daemon <-> registry -->
  <line x1="672" y1="135" x2="798" y2="135" stroke="#8b949e" stroke-width="3" stroke-dasharray="7 5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="735" y="120" text-anchor="middle" font-size="12" fill="#57606a">sharing images</text>

  <!-- ============ MOVING PACKETS ============ -->
  <!-- 1. command packet: client -> daemon -->
  <g>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.19;0.20;1" dur="12s" repeatCount="indefinite"/>
    <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear"
                   keyPoints="0;1;1" keyTimes="0;0.19;1"
                   path="M 275 190 L 350 190 L 350 135 L 428 135"/>
    <rect x="-34" y="-11" width="68" height="22" rx="11" fill="#1f6feb"/>
    <text y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">run nginx</text>
  </g>

  <!-- 2. image layers: registry -> daemon -> images box (three staggered) -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.20;0.201;0.395;0.40;1" dur="12s" repeatCount="indefinite"/>
    <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear"
                   keyPoints="0;0;1;1" keyTimes="0;0.20;0.40;1"
                   path="M 798 135 L 700 135 L 700 215 L 488 215 L 488 340"/>
    <rect x="-14" y="-8" width="28" height="16" rx="3" fill="#0969da"/>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.241;0.395;0.40;1" dur="12s" repeatCount="indefinite"/>
    <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear"
                   keyPoints="0;0;1;1" keyTimes="0;0.24;0.40;1"
                   path="M 798 135 L 700 135 L 700 215 L 488 215 L 488 364"/>
    <rect x="-14" y="-8" width="28" height="16" rx="3" fill="#2f81f7"/>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.281;0.395;0.40;1" dur="12s" repeatCount="indefinite"/>
    <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear"
                   keyPoints="0;0;1;1" keyTimes="0;0.28;0.40;1"
                   path="M 798 135 L 700 135 L 700 215 L 488 215 L 488 388"/>
    <rect x="-14" y="-8" width="28" height="16" rx="3" fill="#79c0ff"/>
  </g>

  <!-- 3. result packet: daemon -> client -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.72;0.721;0.89;0.90;1" dur="12s" repeatCount="indefinite"/>
    <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear"
                   keyPoints="0;0;1;1" keyTimes="0;0.72;0.90;1"
                   path="M 430 158 L 375 158 L 375 215 L 277 215"/>
    <rect x="-24" y="-11" width="48" height="22" rx="11" fill="#2da44e"/>
    <text y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">done</text>
  </g>

  <!-- ============ STEP CAPTIONS ============ -->
  <rect x="20" y="478" width="1060" height="64" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <g font-size="18" font-weight="600" fill="#24292f" text-anchor="middle">
    <text x="550" y="518">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.19;0.20;1" dur="12s" repeatCount="indefinite"/>
      ① The Client sends  docker run nginx  to the Docker Daemon
    </text>
    <text x="550" y="518" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.20;0.21;0.49;0.50;1" dur="12s" repeatCount="indefinite"/>
      ② Image not found locally — the Daemon pulls its layers from the Registry
    </text>
    <text x="550" y="518" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.51;0.69;0.70;1" dur="12s" repeatCount="indefinite"/>
      ③ The Daemon creates and starts a Container from the image
    </text>
    <text x="550" y="518" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.70;0.71;0.94;0.95;1" dur="12s" repeatCount="indefinite"/>
      ④ The result goes back to the Client — nginx is running
    </text>
  </g>
</svg>
